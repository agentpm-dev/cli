[package]
name = "agentpm-sdk"
version = "0.1.13"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
thiserror = "1"
serde_json = "1"
tokio = { version = "1", features = ["fs"] }
url = "2"
