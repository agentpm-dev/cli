[package]
name = "agentpm-cli"
version = "0.1.27"
edition = "2024"

[[bin]]
name = "agentpm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
base64 = "0.21.7"
chacha20poly1305 = "0.10"
chrono = { version = "0.4.41", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
futures = "0.3.31"
glob = "0.3"
globwalk = "0.9"
hex = "0.4"
is-terminal = "0.4"
jsonschema = { version = "0.17", features = ["draft202012"] }
open = "5"
rand = "0.9.2"
rand_core = "0.6.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "blocking"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
semver = "1.0.26"
serde = { version = "1", features = ["derive"] }
# Keep serde_json without preserve_order here: publish author signatures rely
# on default sorted object-key serialization to match server-side verification.
serde_json = "1"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ureq = { version = "2.9", default-features = true } # simple HTTP for schema fetch
walkdir = "2.5.0"
agentpm-sdk = { path = "../agentpm-sdk" }
libc = "0.2.174"
