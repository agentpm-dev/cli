[package]
name = "agentpm-cli"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "agentpm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.41", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
flate2 = "1"
glob = "0.3"
globwalk = "0.9"
is-terminal = "0.4"
jsonschema = { version = "0.17", features = ["draft202012"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ureq = { version = "2.9", default-features = true } # simple HTTP for schema fetch
agentpm-sdk = { path = "../agentpm-sdk" }
reqwest = "0.11.27"
walkdir = "2.5.0"
semver = "1.0.26"
futures = "0.3.31"
base64 = "0.21.7"
