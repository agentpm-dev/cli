name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pin the toolchain (recommended to specify an exact version)
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Show tool versions
        run: rustc --version && cargo fmt --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: Resolver targets and ingestion tests
        run: |
          python3 scripts/check_resolver_targets.py
          python3 -m unittest discover -s scripts -p test_resolver_pins.py -v

      - name: Payload format policy documentation
        run: |
          python3 scripts/check_payload_formats.py --check
          python3 -m unittest discover -s scripts -p test_payload_formats.py -v

      - name: Release and signing contract parity checker tests
        run: |
          python3 -m unittest discover -s scripts -p test_release_contract.py -v
          python3 -m unittest discover -s scripts -p test_sdk_contract.py -v
          python3 scripts/check_registry_bootstrap.py
          python3 -m unittest discover -s scripts -p test_registry_bootstrap.py -v

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all

  platform-targets:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: python3 scripts/check_resolver_targets.py --matrix >> "$GITHUB_OUTPUT"

  platform-tests:
    needs: platform-targets
    name: Native runtime (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Target, payload, archive and publishing contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p agentpm-sdk target::tests
          cargo test -p agentpm-cli --bin agentpm commands::package::tests
          cargo test -p agentpm-cli --bin agentpm io::download::
          cargo test -p agentpm-cli --test payload_compatibility --test ci_publishing --test target_install
      - name: Acquire and verify the pinned native resolver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVER_TARGET: ${{ matrix.target }}
          UV_SMOKE_DIR: ${{ runner.temp }}/uv-contract
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("platforms/uv-pins.json"))["version"])')"
          python scripts/resolver_pins.py "$version" --stage-only --staging "$UV_SMOKE_DIR" --smoke-target "$RESOLVER_TARGET"
      - name: Provision and execute real native Python environments
        shell: bash
        env:
          RESOLVER_TARGET: ${{ matrix.target }}
          UV_SMOKE_DIR: ${{ runner.temp }}/uv-contract
        run: |
          set -euo pipefail
          export AGENTPM_TEST_UV="$(python -c 'import os; from pathlib import Path; print(Path(os.environ["UV_SMOKE_DIR"]) / os.environ["RESOLVER_TARGET"] / ("uv.exe" if os.name == "nt" else "uv"))')"
          export AGENTPM_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export AGENTPM_PYTHON="$AGENTPM_TEST_PYTHON"
          cargo build -p agentpm-cli
          cargo test -p agentpm-cli --bin agentpm python_environment::tests -- --include-ignored --test-threads=1
