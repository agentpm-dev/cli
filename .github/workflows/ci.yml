name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pin the toolchain (recommended to specify an exact version)
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Show tool versions
        run: rustc --version && cargo fmt --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: Resolver targets and ingestion tests
        run: |
          python3 scripts/check_resolver_targets.py
          python3 -m unittest discover -s scripts -p test_resolver_pins.py -v

      - name: Payload format policy documentation
        run: |
          python3 scripts/check_payload_formats.py --check
          python3 -m unittest discover -s scripts -p test_payload_formats.py -v

      - name: Release and signing contract parity checker tests
        run: python3 -m unittest discover -s scripts -p test_release_contract.py -v

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all
